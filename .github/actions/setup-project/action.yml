name: Setup Project
description: >
  Install Python, .NET, cache NuGet, compile UI, and clone CUE4Parse.
  Run actions/checkout before this.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip

    - name: Install Python dependencies
      shell: pwsh
      run: pip install -r requirements.txt

    - name: Compile UI and resources
      shell: pwsh
      run: python compile_ui.py

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Set NuGet packages path
      shell: pwsh
      run: echo "NUGET_PACKAGES=${{ github.workspace }}/.nuget/packages" >> $env:GITHUB_ENV

    - name: Cache NuGet
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-
          nuget-

    # Pinned: CUE4Parse master restructured CUE4Parse_Conversion.Landscape
    # into Exporters/Dto. Bump only together with Format/Unreal/UnrealBridgeProgram.cs.
    - name: Clone CUE4Parse
      shell: pwsh
      run: |
        git clone --depth 1 --revision 5703fc96b1b9a95e13deb3a294456842faad1d71 https://github.com/FabianFG/CUE4Parse.git ../CUE4Parse
        echo "CUE4ParsePathEnv=${{ github.workspace }}\..\CUE4Parse" >> $env:GITHUB_ENV
        echo "CUE4PARSE_SKIP_NATIVE=true" >> $env:GITHUB_ENV
