name: Dev Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      channel: dev

  release:
    needs: ci
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hammer5tools-bundle
          path: Hammer5Tools/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Velopack CLI
        run: |
          dotnet tool install -g vpk
          echo "$HOME\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Read app version
        id: version
        run: |
          $ver = python -c "import json; print(json.load(open('version.json'))['version'])"
          $ver = "$ver-dev.${{ github.run_number }}"
          echo "app_version=$ver" >> $env:GITHUB_OUTPUT
          "$ver`ndev" | Out-File -FilePath Hammer5Tools\version.txt -Encoding utf8

      - name: Get Release Notes
        shell: pwsh
        run: |
          $notes = (git log -n 5 --pretty=format:"* %s (%h)") -join "`n"
          "### Recent Changes (Dev Build):`n`n$notes" | Out-File -FilePath release_notes.md -Encoding utf8

      - name: Velopack Pack
        run: |
          & "$HOME\.dotnet\tools\vpk.exe" pack --packId Hammer5Tools --packVersion ${{ steps.version.outputs.app_version }} --packDir Hammer5Tools --mainExe Hammer5Tools.exe --icon Hammer5ToolsGUI/gui/appicon.ico --channel dev --noPortable --releaseNotes release_notes.md

      - name: Delete old dev release
        run: gh release delete dev --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Velopack Upload
        run: |
          & "$HOME\.dotnet\tools\vpk.exe" upload github --repoUrl https://github.com/dertwist/Hammer5Tools --publish --token ${{ secrets.GITHUB_TOKEN }} --channel dev --tag dev --pre

      - name: Update GitHub Release Description
        run: gh release edit dev --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
